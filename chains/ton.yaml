id: ton
name: TON
family: ton
status: measured
since: 2026-10-18
icon: ton.jpg
asset:
  symbol: USDT
  contract: "EQCxE6mUtQJKFnGfaROTKOt1lZbDiiX1kCixRv7Nw2Id_sDs"
  amount: "0.1"
rpc:
  env: TON_API_URL
  provider: ""
wallets:
  from_env: TON_FROM_KEY
levels:                      # seconds: what the docs say, until measured; role done-final = one level is both
  - { name: "in a shardchain block", detect: "transaction seen in the shard" }   # the docs give no number and say this is not yet final
  - { name: "in a masterchain block", detect: "referenced by a masterchain block", role: done-final, seconds: 1 }   # "typically within 1 second"
claim:
  text: "TON achieves transaction finality after a single masterchain block confirmation, typically within 1 second."
  url: "https://docs.ton.org/applications/payments/overview"
  read_on: 2026-10-18
  next_read: 2026-11-18
note: |
  A shard block is quick, and the masterchain block that seals it is what the docs call final: about a
  second, they say. Measured through TON Center, timing the credit on the recipient's
  jetton wallet (three hops from the sender's message): the slowest of twenty was in a shard block and
  in a masterchain block at 2.3 s, the quickest at 1.1 s and 1.3 s; in sixteen of twenty the two were
  seen in the same poll, so the masterchain seal is at most a few hundred milliseconds behind the shard.
