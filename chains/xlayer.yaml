id: xlayer
name: X Layer
family: evm
status: measured
since: 2026-10-18
icon: xlayer.jpg
chainId: 196
asset:
  symbol: USDC
  contract: "0xB6CEceAB302E2E4948951eE7843FC24E92933061"
  amount: "0.1"
rpc:
  env: XLAYER_RPC_URL
  send_env: XLAYER_SEND_RPC_URL   # the chain's own endpoint: a third-party node did not forward sends to the sequencer
  provider: ""
wallets:
  from_env: EVM_FROM_KEY
levels:                      # seconds: what the docs say, until measured; role done-final = one level is both
  - { name: "in a block", detect: "receipt", role: done, seconds: 1 }   # "1-second block times"
  - { name: "posted to L1", detect: "block tag safe" }   # the RPC serves the OP Stack tags: safe about two minutes behind, finalized about fifteen (read 2026-10-19)
  - { name: "L1 finalized", detect: "block tag finalized", role: final }   # the docs do not define the tags and give no number
claim:
  text: "Fast execution happens on L2 with 1-second block times."
  url: "https://web3.okx.com/xlayer/docs/developer/build-on-xlayer/quickstart"
  read_on: 2026-10-18
  next_read: 2026-11-18
note: |
  OKX's chain, now on the OP Stack with the AggLayer. One-second blocks; what final means on Ethereum,
  the docs do not say in numbers, so the RPC's safe and finalized tags were taken as posted and final.
  Measured from , receipts and sends through the chain's own endpoint, tags through dRPC: the
  slowest of twenty was in a block in 1.5 s, posted to Ethereum in 72 s and finalized there in 16.8 min
  (the twenty between 16.4 and 16.8 min). An earlier run the same day read receipts from a third-party
  node and showed 3.9 s for in a block — the node's lag, not the chain's; the method now reads the
  receipt where the send went.
