id: solana
name: Solana
family: solana
status: measured
since: 2026-10-18
icon: solana.jpg
asset:
  symbol: USDC
  contract: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
  amount: "0.04"               # 0.1 until 2026-10-23; the wallet held 0.95 USDC, his pick: 20 × 0.04
rpc:
  env: SOLANA_RPC_URL
  provider: ""
wallets:
  from_env: SOLANA_FROM_KEY
levels:                      # seconds: what the docs say, until measured; role done-final = one level is both
  - { name: "processed", detect: "commitment=processed" }   # "can still be rolled back"
  - { name: "confirmed", detect: "commitment=confirmed", role: done }   # under Alpenglow (since 2026-10-21): "equivalent" to finalized
  - { name: "finalized", detect: "commitment=finalized", role: final }   # "permanently committed to the ledger and cannot be rolled back"
claim:
  text: "Under Alpenglow, the Confirmed and Finalized commitment statuses are equivalent: both mean that a transaction has been permanently committed to the ledger and cannot be rolled back."
  url: "https://docs.anza.xyz/consensus/commitments"
  read_on: 2026-10-23
  next_read: 2026-11-23
note: |
  Alpenglow replaced TowerBFT at epoch 1064 (2026-10-21). Before it, "finalized" was the rooted slot about
  thirty-two slots after "confirmed", about thirteen seconds by the docs, and measured here at 7.2–8.1 s on
  2026-10-18. Now the two arrive together: in the run of 2026-10-23 every transfer showed both on the same poll.
