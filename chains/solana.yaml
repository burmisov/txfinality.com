id: solana
name: Solana
family: solana
status: measured
since: 2026-10-18
icon: solana.jpg
asset:
  symbol: USDC
  contract: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
  amount: "0.04"               # 0.1 until 2026-10-23; the wallet held 0.95 USDC, his pick: 20 × 0.04
rpc:
  env: SOLANA_RPC_URL
  provider: ""
wallets:
  from_env: SOLANA_FROM_KEY
levels:                      # seconds: what the docs say, until measured; role done-final = one level is both
  - { name: "processed", detect: "commitment=processed" }   # "can still be rolled back"
  - { name: "confirmed", detect: "commitment=confirmed", role: done }   # "voted on by a supermajority of stake"
  - { name: "finalized", detect: "commitment=finalized", role: final }   # "maximum lockout"; "at least a 32 slot difference" after confirmed
claim:
  text: "A block the cluster recognizes as finalized with maximum lockout, meaning it has reached the strongest confirmation state used by the network."
  url: "https://solana.com/docs/rpc"
  read_on: 2026-10-18
  next_read: 2026-11-18
note: |
  "Confirmed" is what wallets show; "finalized" is the rooted slot, about thirty-two slots later,
  which the docs call about thirteen seconds. Both are real, and they are seconds apart.
