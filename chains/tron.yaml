id: tron
name: Tron
family: tron
status: by-design            # by his decision 2026-10-18: no intermediate level the chain stands behind, and solid takes a minute
since: 2026-10-18
icon: tron.jpg
asset:
  symbol: USDT
  contract: "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"
  amount: "0.1"
rpc:
  env: TRON_RPC_URL
  provider: ""
wallets:
  from_env: TRON_FROM_KEY
levels:                      # seconds: what the docs say, until measured; role done-final = one level is both
  - { name: "in a block", detect: "wallet/gettransactioninfobyid", seconds: 3 }   # 3-second blocks; the docs call this pending and reorganisable
  - { name: "solidified", detect: "walletsolidity/gettransactioninfobyid", role: done-final, seconds: 60 }   # 19 distinct SRs, "typically in about 1 minute"
claim:
  text: "Blocks become irreversible — solidified — once at least 19 distinct active SRs have each produced a block at that height or above, typically in about 1 minute."
  url: "https://developers.tron.network/docs/concensus"
  read_on: 2026-10-18
  next_read: 2026-11-18
note: |
  By design: a block every three seconds, but the docs call that pending; the only level Tron stands
  behind is "solidified", nineteen producers later, about a minute. Nothing in between to measure, so
  it is listed with its docs, like Ethereum.
