  read_on: 2026-10-18
  next_read: 2026-11-18
note: |
  Circle's own chain, with USDC as the gas. Two states and nothing between: pending, then final, in
  under a second by its docs. Below the cut by stablecoins held today; listed because it is new and
  built for exactly this. Not measured yet.
